# Global configuration (docs/PLANO.md §5.1, D3, D8, D9, D14).
# Every script reads seeds, paths and sizes from here; no magic numbers in code.

seed: 42
n_jobs: 6  # fixed for determinism (LightGBM, joblib); dev machine has 12 logical cores

paths:
  # Official CICIoT2023 per-capture CSVs (309 files, one folder per label) — source of record (D15)
  raw_csv_dir: data/raw/CSV
  # Kaggle mirror (dhoogla/ciciotdataset2023), used only as an independent cross-check (D15)
  kaggle_parquet: data/external/ciciot2023.parquet
  kaggle_report: data/external/cleaning_report.json
  interim_dir: data/interim
  # All CSV rows with values unaltered, plus label34, category8, y, source_file, row_idx (make ingest, D15)
  interim_parquet: data/interim/ciciot2023_raw.parquet
  processed_dir: data/processed
  # Samples E and M: features, label34, category8, y, source_file, row_idx (make sample, Etapa 2)
  sample_E: data/processed/sample_E.parquet
  sample_M: data/processed/sample_M.parquet
  splits_dir: data/splits
  raw_manifest: data/raw_manifest.csv
  sample_index: data/sample_index.csv.gz
  results_dir: results
  models_dir: models

columns:
  label: label34       # original label (34 values) — never a feature
  category: category8  # attack category (8 values) — never a feature
  target: y            # 1 = attack, 0 = benign
  provenance: [source_file, row_idx]

ingest:  # Etapa 1, D15
  parquet_compression: zstd

inspection:  # Etapa 1
  top_values: 20  # most frequent values listed for columns that look like counts (e.g. Number)

sampling:  # D3 — adjustable to machine memory; record changes in docs/DIARIO.md
  E: {benign: 25000, attack: 25000}  # attack split equally among the 33 types (integer division)
  M: {benign: 100000, attack: 100000}
  oversample_factor: 1.3   # candidates drawn per label = 1.3 × target: slack for duplicate removal (Etapa 2, step 3)
  rare_fraction_E: 0.2     # rare attack types: all rows, split 20% E / 80% M
  parquet_compression: zstd

eda:  # Etapa 3 — sample E only
  quasi_constant_share: 0.999  # most frequent value in more than this share of rows → quasi-constant (task 3)
  corr_threshold: 0.99         # |Pearson| or |Spearman| above this → redundant pair (task 4)
  heavy_tail_skew: 2.0         # unbounded non-negative features with skewness above this → log1p candidate (Etapa 4)
  categorical_features: [Protocol Type]  # IP protocol codes (0, 1, 6, 17, 47): never log-transformed
  single_feature_depth: 2      # depth of the one-feature trees (task 7)
  cv_splits: 5                 # folds for the one-feature trees, stratified by label34
  distribution_features: [Time_To_Live, IAT, Number, Rate, Header_Length, Tot sum, AVG, Std, Protocol Type]
  by_type_features: [Time_To_Live, IAT, Number]

validation:  # D8: split by row, stratified by label34; no grouping by capture (15 attack types have one capture)
  spotcheck: {n_splits: 5, n_repeats: 2}
  outer: {n_splits: 5}  # also the folds of the complementary leave-capture-out design (capture_M, D8 (a))
  inner: {n_splits: 3}

spotcheck:  # Etapa 6 — sample E, folds of make splits (validation role); defaults + search_spaces.yaml fixed
  feature_set: full

search:  # D9
  n_iter: 30
  finalists: 3
  finalist_models: [lightgbm, random_forest, mlp]  # Etapa 6 (results/spotcheck/selection.json; DIARIO 2026-11-06)
  reference_models: [decision_tree, dummy]  # tree tuned too, to test H1 (P7, 2026-11-06); dummy = floor, never tuned

nested:  # Etapa 7 — sample M, folds of make splits (outer: test; inner: validation)
  feature_set: full

interpretation:  # D11 — Etapa 9, best model of Etapa 8 only; pre-registered 2026-11-12
  permutation_repeats: 10
  shap_rows_per_fold: 2000         # uniform random rows of each outer test fold
  top_k: 10                        # ranking stability: overlap of the top-k features between folds
  dependence_features: [Number, Time_To_Live, IAT]
  local: {worst_types: 3, false_positives: 2}  # one typical false negative per worst type + benign FPs

evaluation:  # Etapa 8 — out-of-fold predictions of results/nested (D5, D6, D10, D16); pre-registered 2026-11-12
  models: [lightgbm, random_forest, mlp, decision_tree, dummy]  # table order; each model keeps its colour
  confidence_level: 0.95
  alpha: 0.05
  comparisons:  # Holm family of the corrected resampled t-test (D10); Q1: first two pairs, H1: last two
    - [lightgbm, random_forest]
    - [lightgbm, mlp]
    - [lightgbm, decision_tree]
    - [random_forest, decision_tree]
  bootstrap: {n_resamples: 1000, stratify: label34}  # P5: percentile intervals, paired across models; seed = seed
  prevalences: [0.01, 0.05, 0.1, 0.5]  # P1 (b); the attack prevalence of the dataset is added from label_counts_total
  h2_categories: [Web, BruteForce, Recon]  # H2 (PLANO §2.5): low-volume attacks

ablation:  # Etapa 9 (D12, Q3, H3): Etapa 7 repeated for the best model of Etapa 8 without the shortcut candidates
  reference: full
  feature_sets: [no_shortcut, no_window, no_ttl]  # run order; no_window and no_ttl are the first cut of PLANO §8.2
  single_features: [Number, Time_To_Live, IAT]   # one-feature trees (depth eda.single_feature_depth) on M
  mcc_drop: {small: 0.01, large: 0.05}           # size of a significant MCC drop: small < 0.01 <= moderate < 0.05 <= large
  type_collapse: 0.10                            # per-type sensitivity drop with non-overlapping Wilson intervals
  h3:  # first part of H3 holds if the TTL-only tree on M repeats sample E (pre-registered 2026-11-12)
    mcc_tolerance: 0.02                          # |MCC on M - MCC on E| at most this
    tpr_window100_min: 0.90                      # "high" sensitivity on 100-packet windows (fixed in code before the first run)
    fpr_min: 0.20                                # false positive rate at least this

final:  # Etapa 10 task 1 (also feeds the leave-capture-out of Etapa 9): search on all of M, never re-evaluated
  cv_splits: 3                                   # stratified by label34, like the inner loop
